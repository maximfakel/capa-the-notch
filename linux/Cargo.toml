[workspace]
resolver = "2"
# The Linux version. The Swift app at the root of the repository builds with SwiftPM, apart from this.
members = [
    "crates/core", "crates/services", "crates/hub", "crates/platform",
    "crates/music", "crates/teleprompter", "crates/shelf", "crates/dictation", "crates/settings",
    "daemon", "claude-bridge",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
ureq = "3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
cpal = "0.15"
libloading = "0.8"
bzip2 = "0.5"
tar = "0.4"
futures-util = { version = "0.3", default-features = false }
